# toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emulator3"
version = "0.1.0"
description = "KIWI biolab Emulator - manage experimental-computational workflows with Apache Airflow and Docker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "martin fluna" } ]
keywords = ["airflow", "docker", "emulator", "biolab"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
    "sqlalchemy>=1.4",
    "pymysql>=1.0",
    "mysql-connector-python>=8.0",
    "python-dotenv>=0.21.0",
    "numpy",

]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black>=24.0",
  "flake8>=6.0",
]

[tool.setuptools.packages.find]
where = ["dags"]
exclude = ["tests*"]
